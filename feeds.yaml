  # --- Net-new adds (September 2026 revision) ---
  # Sourced from Calcalist/CTech, Geektime, SecurityWeek and TechCrunch coverage
  # of funding + stealth exits since the June snapshot.
  - name: AIR Security
    # $50M seed (Sequoia + Greenoaks), out of stealth 2026-09-03.
    # Niv Hoffman / Yair Saban. Scans skills, plugins and MCP servers for
    # malicious instructions, excessive permissions and supply-chain risk.
    # Closest thing to a mirror of our skills posture analyzer. Highest priority.
    url: https://www.air.security/blog
    link_selector: a[class*=card], a[class*=blog]
    tier: 1
  - name: Pluto Security
    # EDR/MDM API collectors + inline hooks on coding agents; blocks down to a
    # specific tool, skill or MCP action. Same architecture as ours.
    # Found installed alongside us at Lemonade (May 2026).
    url: https://pluto.security/blog/
    tier: 1
  - name: Neo
    # $100M (a16z + Bessemer), out of stealth 2026-07. SentinelOne/Wiz/PANW
    # founders. Real-time control layer for AI agents at the endpoint.
    url: https://www.neo.ai/blog/
    tier: 1
  - name: Glow
    # $180M at $1.2B, out of stealth 2026-07-22. AI-native endpoint security;
    # explicitly targets monitoring/controlling AI tool adoption on corp devices.
    url: https://www.glow.io/blogs
    tier: 1
  - name: Helmet Security
    # $9M (SYN Ventures). Was on the pre-launch skip list in the June snapshot.
    # End-to-end MCP lifecycle: discovery, monitoring, access policy.
    url: https://www.helmet.sh/blog/
    tier: 1
  - name: MintMCP
    # MCP gateway + "Agent Monitor" covering Claude Code, Claude Cowork, Cursor,
    # Codex and Copilot. Publishes head-to-head comparison content.
    # Very high-volume SEO content ("AWS Bedrock pricing explained"). Tier 3 so
    # only genuine agent/MCP research gets through.
    url: https://www.mintmcp.com/blog
    tier: 3
  - name: Aurascape
    # AI-native visibility/guardrails incl. coding-assistant guardrails and
    # MCP-connected systems. RSAC Innovation Sandbox alum.
    # Feed carries data sheets and usage guides alongside research — tier 2.
    url: https://aurascape.ai/resources/blog/
    tier: 2

# --- Known-broken sources (verified 2026-09-27, pre-existing — not yet fixed) ---
# These fail identically on the pre-revision watcher, so they are long-standing
# breakage rather than fallout from this change. Left in place, needs a pass:
#   Protect AI (Palo Alto) — 404. Blog moved after the Palo Alto acquisition.
#   Apiiro                 — 403, bot-blocked. Needs a real UA or an RSS URL.
#   AIM Security (Cato)    — 0 entries; catonetworks.com/blog/ markup changed.
# Additionally these 19 have never returned a single article since June and are
# almost certainly wrong URLs or JS-only pages. Four are tier 1, so we are
# currently blind to competitors we care about:
#   tier 1: Operant AI, Manifold Security, Realm Labs, Salus (YC W26)
#   tier 2: Aira Security, Airrived, Bonfy.AI, Capsule Security, Galene.ai,
#           Geordie AI, Harmonic Security, Keycard, Lyrie.ai, Orchid Security,
#           Starseer, Token Security, Xeris
#   tier 3: Dtex, PlainID

