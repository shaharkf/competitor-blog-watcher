# Competitor blogs to watch — extracted from Notion "AI Security Vendor Intelligence"
# (Market Research May 2026). Last revised: 2026-09-27.
#
# url  = vendor blog/homepage. The watcher auto-discovers RSS from the page;
#        if none exists it falls back to scraping article-looking links.
#        Add an explicit `rss:` once you confirm a feed URL — most reliable path.
#
# tier = how much noise we tolerate from this source (see watcher.py):
#   1  Direct competitor in our wedge — endpoint/runtime control of AI agents,
#      coding agents, MCP, skills/plugins. We WANT their product launches.
#   2  Adjacent AI security (LLM firewall, AI-SPM, agent identity, data).
#      Research and vulns only; launches are filtered out.
#   3  Big-corp / platform / non-AI-native vendor. Strictest: only agentic-AI
#      research, vulns and standards work gets through.
#
# Skipped (no public homepage / pre-launch): Sun Security, Dash Security,
# OBVERRA, Certiv (verify), Manufact, Obot, CrowdStrike-Nest stealth cluster.

